<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Smart Task Manager</h1>
  </header>
  <div class="app-layout">
    <aside class="sidebar">
      <ul>
        <li>งานทั้งหมด</li>
        <li>งานที่เสร็จแล้ว</li>
      </ul>
    </aside>
    <div class="main-content">
    <!-- เพิ่มส่วนฟอร์มสำหรับรับข้อมูลใหม่ -->
    <form id="taskForm" style="margin-bottom: 20px; display: flex; gap: 10px;">
      <input type="text" id="taskInput" placeholder="เพิ่มงานใหม่..." required style="flex-grow: 1; padding: 10px;">
      <select id="priorityInput">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <button type="submit" style="padding: 10px 20px;">เพิ่มงาน</button>
    </form>
    
    <!-- พื้นที่แสดงงาน (ลบการ์ดจำลองทิ้ง ปล่อยให้ว่างไว้ และใส่ id="taskList") -->
    <main class="main-content" id="taskList"></main>
  </div>
    <main class="main-content">
      <div class="task-card">
        <input type="checkbox">
        <span class="task-text">ศึกษาเรื่อง HTML Box Model</span>
        <button class="delete-btn">ลบ</button>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
